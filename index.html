<style>
  body{margin:0;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#145A3D;text-decoration:none} a:hover{color:#F15A24}
  input,select,button,textarea{font-family:'Poppins',sans-serif}
  ::placeholder{color:#98A2B3}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#D5DDD8;border-radius:99px} ::-webkit-scrollbar-track{background:transparent}
  @media(max-width:1100px){ [data-grid="two"]{grid-template-columns:1fr!important} }
  @media(max-width:760px){ [data-screen-label="Filters"],[data-screen-label="Customer list"]{display:none!important} [data-shell]{grid-template-columns:1fr!important} }
</style>

</head><body><div id="__mount"></div>
<template id="__template">
<div data-screen-label="Cockpit" data-shell="" style="display:grid;grid-template-columns:206px minmax(0,1fr);height:100vh;overflow:hidden;background:#F3F7F4;color:#1B2B4B;font-size:13px">

  <!-- ============ RAIL ============ -->
  <aside data-screen-label="Filters" style="background:#33383C;display:flex;flex-direction:column;overflow-y:auto;border-right:3px solid #145A3D">
    <div style="display:flex;align-items:center;gap:9px;padding:14px 14px 12px">
      <div style="width:30px;height:30px;border-radius:8px;background:#145A3D;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:.04em">TNR</div>
      <div><div style="color:#fff;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase">Tenera</div><div style="color:#8B959B;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase">Sales cockpit</div></div>
    </div>
    <div style="display:flex;gap:6px;padding:0 12px 12px">
      <sc-for list="{{navBtns}}" as="n" hint-placeholder-count="3">
        <button sc-camel-on-click="{{n.onTap}}" style="flex:1;border:1px solid {{n.border}};background:{{n.bg}};color:{{n.color}};border-radius:8px;padding:6px 4px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer">{{n.label}}</button>
      </sc-for>
    </div>
    <div style="padding:0 12px 10px">
      <input value="{{q}}" sc-camel-on-change="{{setQ}}" placeholder="Search customers…" style="width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;border-radius:8px;font-size:12px;padding:7px 10px;outline:none">
    </div>
    <div style="padding:0 12px 14px;border-bottom:1px solid rgba(255,255,255,.08)">
      <div style="font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#4CC38A;margin-bottom:6px">Ask the CRM</div>
      <div style="display:flex;gap:6px">
        <input placeholder="who's stalled?" style="flex:1;min-width:0;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:#fff;border-radius:8px;font-size:12px;padding:7px 10px;outline:none">
        <button style-hover="background:#D94A18" style="border:none;background:#F15A24;color:#fff;border-radius:8px;padding:7px 12px;font-size:11px;font-weight:600;cursor:pointer">Ask</button>
      </div>
    </div>
    <div style="padding:12px;display:flex;flex-direction:column;gap:10px">
      <div style="font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#8B959B">Filter</div>
      <sc-raw-select value="{{heatVal}}" sc-camel-on-change="{{setHeat}}" style="width:100%;border:1px solid rgba(255,255,255,.16);background:#3D4348;color:#E4E9EB;border-radius:8px;font-size:12px;padding:7px 8px;outline:none">
        <option value="all">All heat</option><option value="hot">Hot</option><option value="warm">Warm</option><option value="luke">Lukewarm</option><option value="cold">Cold</option>
      </sc-raw-select>
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:#C9D1D4;cursor:pointer"><input type="checkbox" checked="{{hideLost}}" sc-camel-on-change="{{toggleLost}}" style="accent-color:#4CC38A">Hide lost</label>
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:#C9D1D4;cursor:pointer"><input type="checkbox" checked="{{hideEngaged}}" sc-camel-on-change="{{toggleEngaged}}" style="accent-color:#4CC38A">Hide engaged</label>
      <label style="display:flex;align-items:center;gap:7px;font-size:12px;color:#C9D1D4;cursor:pointer"><input type="checkbox" checked="{{upcoming}}" sc-camel-on-change="{{toggleUpcoming}}" style="accent-color:#4CC38A">Upcoming demos</label>
      <div style="font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#8B959B;margin-top:4px">Sort</div>
      <sc-raw-select value="{{sortVal}}" sc-camel-on-change="{{setSort}}" style="width:100%;border:1px solid rgba(255,255,255,.16);background:#3D4348;color:#E4E9EB;border-radius:8px;font-size:12px;padding:7px 8px;outline:none">
        <option value="priority">Priority</option><option value="score">Score</option><option value="stalest">Stalest first</option><option value="recent">Recently touched</option><option value="demo">Next demo</option>
      </sc-raw-select>
      <div style="font-size:9.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:#8B959B;margin-top:4px">Starred by</div>
      <sc-raw-select value="{{starVal}}" sc-camel-on-change="{{setStarBy}}" style="width:100%;border:1px solid rgba(255,255,255,.16);background:#3D4348;color:#E4E9EB;border-radius:8px;font-size:12px;padding:7px 8px;outline:none">
        <option value="none">Everyone</option><option value="any">★ Any starred</option><option value="boris">★ Boris</option><option value="ben">★ Ben</option><option value="quinn">★ Quinn</option><option value="alex">★ Alex</option><option value="daisy">★ Daisy</option><option value="dariia">★ Dariia</option>
      </sc-raw-select>
    </div>
    <div style="margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,.08)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px">
        <span style="font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8B959B">List density</span>
        <span style="display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:7px;overflow:hidden">
          <button sc-camel-on-click="{{setCompact}}" style="border:none;padding:3px 9px;font-size:9.5px;font-weight:600;cursor:pointer;background:{{denCompactBg}};color:{{denCompactColor}}">Compact</button>
          <button sc-camel-on-click="{{setCozy}}" style="border:none;padding:3px 9px;font-size:9.5px;font-weight:600;cursor:pointer;background:{{denCozyBg}};color:{{denCozyColor}}">Cozy</button>
        </span>
      </div>
      <div style="font-size:10.5px;color:#8B959B">{{pipelineNote}}</div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);font-size:9.5px;color:#6B7378;letter-spacing:.02em;font-variant-numeric:tabular-nums">{{appVersion}}</div>
    </div>
  </aside>

  <div style="display:flex;min-width:0;min-height:0">
  <sc-if value="{{viewCustomers}}" hint-placeholder-val="{{true}}">

  <!-- ============ LIST ============ -->
  <section data-screen-label="Customer list" style="width:280px;flex:0 0 auto;background:#fff;border-right:1px solid #E7EBF0;display:flex;flex-direction:column;min-height:0">
    <div style="padding:10px 14px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#98A2B3;border-bottom:1px solid #E7EBF0;display:flex;justify-content:space-between"><span>{{listCount}}</span><span style="color:#C3CBD6">{{sortLabel}}</span></div>
    <div id="__listScroll" data-keepscroll="1" style="flex:1;overflow-y:auto;min-height:0">
      <sc-for list="{{rows}}" as="c" hint-placeholder-count="7">
        <div sc-camel-on-click="{{c.onSelect}}" style-hover="background:#F7FAF8" style="display:flex;gap:9px;padding:{{listPad}} 12px;border-bottom:1px solid #F1F4F2;cursor:pointer;border-left:3px solid {{c.edge}};background:{{c.rowBg}}">
          <div style="width:36px;height:36px;border-radius:50%;background:#EEF2F6 center/cover no-repeat {{c.photoBg}};border:2px solid {{c.heatColor}};display:grid;place-items:center;font-size:11px;font-weight:700;color:#5B6B85;flex:0 0 auto">{{c.avInit}}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.name}}</div>
            <div style="font-size:11px;color:#98A2B3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{c.company}}</div>
            <div style="display:flex;align-items:center;gap:5px;margin-top:4px;flex-wrap:wrap">
              <span style="font-size:8.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:99px;background:{{c.stageBg}};color:{{c.stageColor}};white-space:nowrap">{{c.stageShort}}</span>
              <span style="display:inline-flex;gap:2px;align-items:flex-end" title="Readiness ladder">
                <sc-for list="{{c.ladder}}" as="b" hint-placeholder-count="6"><i style="display:inline-block;width:4px;border-radius:2px;height:{{b.h}};background:{{b.bg}}"></i></sc-for>
              </span>
              <span style="font-size:9.5px;font-weight:600;color:{{c.flagColor}};white-space:nowrap">{{c.flag}}</span>
            </div>
          </div>
          <div style="text-align:right;flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px">
            <span style="display:flex;align-items:center;gap:4px">
              <button sc-camel-on-click="{{c.onStar}}" title="Star" style-hover="color:#E0A82E" style="border:none;background:none;cursor:pointer;padding:0;font-size:12px;line-height:1;color:{{c.starColor}}">{{c.starGlyph}}</button>
              <span style="font-size:14px;font-weight:700;color:{{c.scoreColor}};font-variant-numeric:tabular-nums">{{c.score}}</span>
            </span>
            <span style="font-size:9px;font-weight:600;color:{{c.timeColor}};white-space:nowrap">{{c.timeStr}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- ============ DETAIL ============ -->
  <main id="__detailScroll" data-keepscroll="1" data-screen-label="Customer detail" style="flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow-y:auto">
    <div style="background:#fff;border-bottom:1px solid #E7EBF0;padding:12px 18px 11px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="width:44px;height:44px;border-radius:12px;background:#145A3D center/cover no-repeat {{sel.photoBg}};display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700">{{sel.avInit}}</div>
        <div style="min-width:0">
          <div style="display:flex;align-items:center;gap:7px">
            <h1 style="margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em">{{sel.name}}</h1>
            <button sc-camel-on-click="{{toggleStar}}" title="Star / favourite" style="border:none;background:none;cursor:pointer;font-size:14px;padding:0;line-height:1;color:#E0A82E">{{starGlyph}}</button>
          </div>
          <div style="font-size:11.5px;color:#98A2B3">{{sel.titleCo}}</div>
        </div>
        <span style="flex:1"></span>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <button sc-camel-on-click="{{copyPhone}}" title="Click to copy" style-hover="border-color:#4CC38A" style="border:1px solid #E7EBF0;background:#fff;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:center"><span style="color:#98A2B3">✆</span>{{phoneLabel}}<b style="font-weight:600;color:{{sel.timeTone}}">{{sel.timeFull}}</b></button>
          <button sc-camel-on-click="{{copyEmail}}" title="Click to copy" style-hover="border-color:#4CC38A" style="border:1px solid #E7EBF0;background:#fff;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:500;cursor:pointer;display:flex;gap:6px;align-items:center"><span style="color:#98A2B3">✉</span>{{emailLabel}}</button>
          <a href="#" style="border:1px solid #E7EBF0;background:#fff;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:600;color:#145A3D">HubSpot ↗</a>
          <button style-hover="border-color:#4CC38A" style="border:1px solid #E7EBF0;background:#fff;border-radius:8px;padding:5px 10px;font-size:11.5px;font-weight:600;color:#33383C;cursor:pointer">⤓ PDF</button>
          <button sc-camel-on-click="{{toggleDetailView}}" style-hover="border-color:#4CC38A;color:#145A3D" style="border:1px solid {{detailBtnBorder}};background:{{detailBtnBg}};border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:600;color:{{detailBtnColor}};cursor:pointer">{{detailBtnLabel}}</button>
          <button style-hover="background:#0E3F2B" style="border:none;background:#145A3D;color:#fff;border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer">Chat</button>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center">
        <sc-for list="{{badges}}" as="b" hint-placeholder-count="5">
          <span style="font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:{{b.bg}};color:{{b.color}};white-space:nowrap">{{b.label}}</span>
        </sc-for>
      </div>
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;align-items:center;border-top:1px solid #F1F4F7;padding-top:9px">
        <span style="display:flex;align-items:center;gap:6px">
          <span style="font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#98A2B3">Leading</span>
          <sc-raw-select value="{{ownerVal}}" sc-camel-on-change="{{setOwner}}" style="border:1px solid #E7EBF0;background:#F7F9F8;border-radius:99px;font-size:11px;font-weight:600;padding:3px 8px;color:#33383C;cursor:pointer;outline:none">
            <option value="Boris">Boris</option><option value="Ben">Ben</option><option value="Quinn">Quinn</option><option value="Alex">Alex</option><option value="Daisy">Daisy</option><option value="Dariia">Dariia</option><option value="Unassigned">Unassigned</option>
          </sc-raw-select>
        </span>
        <button sc-camel-on-click="{{toggleEngagedSel}}" title="Auto-derived — click to override" style="border:1px solid {{eng.border}};background:{{eng.bg}};color:{{eng.color}};border-radius:99px;font-size:10.5px;font-weight:600;padding:3px 10px;cursor:pointer">{{eng.label}}</button>
        <span style="display:flex;align-items:center;gap:6px">
          <span style="font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#98A2B3">Deal size</span>
          <input type="number" min="1" value="{{dealEng}}" sc-camel-on-change="{{setDealEng}}" style="width:44px;border:1px solid #E7EBF0;background:#F7F9F8;border-radius:7px;font-size:11.5px;font-weight:600;padding:3px 6px;outline:none;text-align:center">
          <span style="font-size:10.5px;color:#98A2B3">engineers ·</span>

function copyVal(val,el){
  const v=String(val||'').trim(); if(!v) return;
  const done=()=>{ if(el){ const o=el.getAttribute('data-lbl')||el.textContent; el.setAttribute('data-lbl',o); el.textContent='✓ copied'; el.classList.add('copied'); setTimeout(()=>{ el.textContent=el.getAttribute('data-lbl'); el.classList.remove('copied'); },1100); } };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(done).catch(()=>fallbackCopy(v,done)); }
  else fallbackCopy(v,done);
}
function fallbackCopy(v,cb){ try{ const t=document.createElement('textarea'); t.value=v; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); cb&&cb(); }catch(e){} }
function teamsLink(phone){ let d=String(phone||'').replace(/[^\d]/g,''); if(!d) return '#'; if(d.length===10) d='1'+d; return `https://teams.microsoft.com/l/call/0/0?users=4:+${d}`; }
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const initials = n => n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const MONN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TODAY=new Date(); // real now
function parseD(s){
  if(!s||s==='today') return new Date();
  s=String(s).trim();
  const m=s.match(/(\d{1,2})[-\s]([A-Za-z]{3,9})\.?(?:[-\s](\d{2,4}))?/);
  if(m){ const mo=MON[m[2].slice(0,3).toLowerCase().replace(/^./,c=>c.toUpperCase())]; if(mo!=null){ const y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):TODAY.getFullYear(); return new Date(y,mo,+m[1]); } }
  const d=new Date(s); return isNaN(d)?null:d;
}
function toDMY(iso){ if(!iso) return 'today'; const p=String(iso).split('-'); if(p.length<3) return iso; const d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d)?iso:`${String(d.getDate()).padStart(2,'0')}-${MONN[d.getMonth()]}-${String(d.getFullYear()).slice(2)}`; }
function isTouch(m){ return !(m.type==='meeting'&&['cancelled','moved','noshow'].includes(m.status)); }
function touchStats(c){
  const past=c.comms.map(m=>({m,d:parseD(m.d)})).filter(x=>x.d && x.d<=TODAY && isTouch(x.m));
  const last=past.reduce((a,x)=>(!a||x.d>a.d)?x:a,null);
  const days=last?Math.round((TODAY-last.d)/86400000):null;
  return {n:past.length, lastDate:last?last.m.d:'—', days};
}
const staleCls = d => d>30?'stale':d>14?'warmw':'';
// A response = client actually engaged back: inbound email, connected call, or attended (past) meeting.
function isResp(m){ const d=parseD(m.d); if(!d||d>TODAY) return false; return (m.type==='meeting'&&(!m.status||m.status==='held'))||m.type==='callok'||(m.type==='email'&&m.dir==='in'); }
function respStats(c){
  const all=c.comms.map(m=>({m,d:parseD(m.d)})).filter(x=>x.d&&x.d<=TODAY&&isTouch(x.m));
  const resp=all.filter(x=>isResp(x.m));
  const last=resp.reduce((a,x)=>(!a||x.d>a.d)?x:a,null);
  const days=last?Math.round((TODAY-last.d)/86400000):null;
  const lastTouch=all.reduce((a,x)=>(!a||x.d>a.d)?x:a,null);
  const awaiting=lastTouch&&!isResp(lastTouch.m)&&(!last||lastTouch.d>last.d);
  return {lastDate:last?last.m.d:null, days, awaiting, awaitingDays:awaiting?Math.round((TODAY-lastTouch.d)/86400000):null};
}
function trialDaysLeft(c){ const e=parseD(c.trialEnds); return e?Math.round((e-TODAY)/86400000):null; }
function trialText(c){
  const td=trialDaysLeft(c);
  if(td==null) return 'No active trial';
  if(td<0) return `<span style="color:#e5484d;font-weight:600">Trial ended ${Math.abs(td)}d ago</span>`;
  return `Trial ends ${c.trialEnds} · <span style="color:${td<=7?'#e5484d':'#9a7b12'};font-weight:600">${td}d left</span>`;
}
// Blended priority for "who to call now": heat + deal size + urgency signals.
function priority(c){
  if(c.stage==='Closed Lost') return 0;
  let p={Hot:40,Warm:26,Lukewarm:14,Cold:4}[c.sentiment]||0;
  p += Math.min(28, c.reportsMonth||0);
  const r=respStats(c);
  if(r.awaiting && r.awaitingDays>=3) p+=10;
  if(r.days!=null && r.days>21) p+=8;
  const td=trialDaysLeft(c);
  if(td!=null && td>=0 && td<=7) p+=20;
  if(!c.nextMeeting) p+=6;
  return Math.min(100,Math.round(p));
}

function renderList(){
  const q=(document.getElementById('q').value||'').toLowerCase();

  const hideLost=document.getElementById('f-lost').checked;
  const hideEng=document.getElementById('f-eng').checked;
  const sortMode=document.getElementById('f-sort').value;
  const demoOn=document.getElementById('f-demo')&&document.getElementById('f-demo').checked;
  const upcomingOn=document.getElementById('f-upcoming')&&document.getElementById('f-upcoming').checked;
  const starBy=document.getElementById('f-starred')?document.getElementById('f-starred').value:'';
  const passStar=c=>{ if(!starBy) return true; if(!c.starred) return false; if(starBy==='__any__') return true; return c.owner===starBy; };
  const dFrom=document.getElementById('f-demo-from')?document.getElementById('f-demo-from').value:'';
  const dTo=document.getElementById('f-demo-to')?document.getElementById('f-demo-to').value:'';
  const inDemoRange=c=>{ if(!demoOn) return true; const d=(c.demoDate||'').slice(0,10); if(!d) return false; return (!dFrom||d>=dFrom)&&(!dTo||d<=dTo); };
  const el=document.getElementById('list'); el.innerHTML='';
  const shown = customers
    .filter(c=>(!q||c.name.toLowerCase().includes(q)||c.company.toLowerCase().includes(q)||(c.email||'').toLowerCase().includes(q))
      && (!sent||c.sentiment===sent)
      && (!hideLost||c.stage!=='Closed Lost')
      && (!hideEng||!c.engaged)
      && (sortMode!=='activity'||!!c.activityDate)
      && (!upcomingOn||!!c.upcomingDate)
      && passStar(c)
      && inDemoRange(c))
    .sort((a,b)=>{
      const sm = upcomingOn ? 'upcoming' : sortMode;
      if(sm==='priority') return priority(b)-priority(a);
      if(sm==='value')  return estMRR(b)-estMRR(a);
      if(sm==='stale')  return (touchStats(b).days??1e9)-(touchStats(a).days??1e9);
      if(sm==='recent') return (touchStats(a).days??1e9)-(touchStats(b).days??1e9);
      if(sm==='activity') return (b.activityDate||'').localeCompare(a.activityDate||'');
      if(sm==='upcoming'){
        const ad=(a.upcomingDate||(a.upcomingDemo&&a.upcomingDemo.iso)||'9999-12-31');
        const bd=(b.upcomingDate||(b.upcomingDemo&&b.upcomingDemo.iso)||'9999-12-31');
        const c=ad.slice(0,10).localeCompare(bd.slice(0,10));
        if(c!==0) return c;
        const ct=ad.localeCompare(bd);           // same day → order by time
        if(ct!==0) return ct;
        return (a.name||'').localeCompare(b.name||''); // stable tiebreak
      }
      return b.score-a.score;
    });
  const cnt=document.getElementById('list-count');
  if(cnt) cnt.textContent = shown.length===customers.length ? `${shown.length}` : `${shown.length} of ${customers.length}`;
  shown.forEach(c=>{
    const d=document.createElement('div');
    d.className='row'+(c.id===currentId?' active':'');
    d.onclick=()=>openCustomer(c.id);
    const ts=touchStats(c); const rs=respStats(c);
    const subline = (sortMode==='upcoming'||upcomingOn)&&c.upcomingDate
      ? `📅 Demo ${esc(c.upcomingDemo?c.upcomingDemo.date:'')}`
      : sortMode==='activity'
      ? `⚡ ${esc(c.lastActivity||'—')}`
      : `💬 ${ts.n} touches · ↩ reply ${rs.lastDate||'—'}${rs.days!=null?` <span class="${staleCls(rs.days)}">(${rs.days}d)</span>`:''}${rs.awaiting?` · <span class="stale">awaiting ${rs.awaitingDays}d</span>`:''}`;
    d.innerHTML=`${avatarHTML(c,'av')}
      <div class="meta">
        <div class="nm">${esc(c.name)}</div>
        <div class="co">${esc(c.company)}</div>
        <div class="tags"><span class="sdot" style="background:var(${SENT[c.sentiment]})"></span>
          <span class="chip">${esc(c.stage)}</span>
          <span class="chip">${c.reportsMonth||0} rpts/mo</span>
          <span class="score ${scoreClass(c.score)}">${c.score}</span></div>
        <div class="rsub">${subline}</div>
      </div>`;
    el.appendChild(d);
  });
}

// Derive the 8-signal bar from live data when explicit c.sig isn't provided.
function computeSignals(c){
  if(c.sig && c.sig.length) return c.sig;
  const out=[]; const r=respStats(c); const t=touchStats(c); const td=trialDaysLeft(c);
  const lost=(c.stage==='Closed Lost');
  // Next best action (heuristic) — first chip
  let nba;
  if(lost) nba='No action — deal closed lost; revisit later.';
  else if(td!=null && td>=0 && td<=7) nba='Trial ends in '+td+'d — book a build session now.';
  else if(r.awaiting) nba='Awaiting reply '+r.awaitingDays+'d — call instead of emailing again.';
  else if(!c.nextMeeting) nba='No meeting booked — propose a next session.';
  else nba='Prep the '+c.nextMeeting+' meeting.';
  out.push(['🎯', lost?'Hold':'Next', 'act', '<b>Next best action:</b> '+esc(nba)]);
  // Ball in court
  if(lost) out.push(['⚖️','Closed','neutral','<b>Ball in court:</b> Closed Lost.']);
  else if(r.awaiting) out.push(['⚖️','Them · '+r.awaitingDays+'d', r.awaitingDays>7?'bad':'warn', '<b>Ball in court:</b> Them — awaiting a reply for '+r.awaitingDays+'d since your last outreach.']);
  else if(r.lastDate) out.push(['⚖️','You'+(r.days!=null?' · '+r.days+'d':''), r.days>14?'bad':'warn', '<b>Ball in court:</b> You — they last engaged '+r.days+'d ago; your move.']);
  else out.push(['⚖️','You','warn','<b>Ball in court:</b> You — no response logged yet.']);
  // Engagement (last real response)
  if(r.lastDate) out.push(['📨','Replied '+r.days+'d', r.days>21?'bad':r.days>10?'warn':'ok', '<b>Engagement:</b> Last real response (reply / connected call / attended meeting) on '+r.lastDate+' ('+r.days+'d ago).']);
  else out.push(['📨','No reply','bad','<b>Engagement:</b> No inbound reply, connected call, or attended meeting logged yet.']);
  // Trial / volume
  if(td!=null) out.push(['📈', td<0?'Trial ended':'Trial '+td+'d', (td<0||td<=7)?'bad':'warn', '<b>Trial:</b> '+trialText(c).replace(/<[^>]+>/g,'')]);
  else if(c.reportsMonth) out.push(['📈','~'+c.reportsMonth+'/mo','ok','<b>Volume:</b> ~'+c.reportsMonth+' reports/month'+(c.engineers?(' · '+c.engineers+' engineers'):'')+'.']);
  // Deal size
  if(c.engineers) out.push(['🧭', fmtMRR(c).replace('~',''), 'neutral', '<b>Deal size:</b> '+c.engineers+' engineers · ~'+(c.reportsMonth||'?')+' reports/mo · '+fmtMRR(c)+'.']);
  // Blocker
  if(c.blocker) out.push(['⚔️','Blocker','warn','<b>Blocker:</b> '+esc(c.blocker)]);
  // Nurture
  out.push(['💬', t.n+' touches', (t.days!=null&&t.days>21?'warn':'neutral'), '<b>Nurture:</b> '+t.n+' touches · last touch '+t.lastDate+(t.days!=null?' ('+t.days+'d ago)':'')+'.']);
  return out;
}

// in-sequence next action: first incomplete rung wins, even if later ones done
function rMode(r){
  const rungs=[
    {k:'likes', v:Number(r.likes)||0,  ok:(Number(r.likes)||0)>=75,  msg:'get them to like it — land one win on their own work'},
    {k:'sees',  v:Number(r.sees)||0,   ok:(Number(r.sees)||0)>=75,   msg:'nail down where they’d actually use it'},
    {k:'invite',v:Number(r.invite)||0, ok:(Number(r.invite)||0)>=75, msg:'get them willing to invite colleagues (names)'},
    {k:'tpl',   v:0, ok:!!(r.tplAgreed&&r.tplSent&&r.tplSetup&&r.tplAccepted), msg:rTplNext(r)},
    {k:'reach', v:Number(r.reach)||0,  ok:(Number(r.reach)||0)>=75,  msg:'get a cell number so you can reach them'}
  ];
  const firstOpen=rungs.find(x=>!x.ok);
  const champion=!firstOpen;
  let na;
  if(champion){ na=r.demands&&r.demands.trim()?'They’re sold — satisfy their onboarding demands and map the approver so they can pitch internally.':'They’re sold — arm them for the internal pitch. Map the approver and confirm whether you need to meet management.'; }
  else { na=(r.approved?'Management approved them, but the sequence isn’t done — ':'')+'Next: '+firstOpen.msg+'.'; }
  return {champion,na};
}
function rTplNext(r){
  if(!r.tplAgreed) return 'get them to agree to the template';
  if(!r.tplSent)   return 'send the template';
  if(!r.tplSetup)  return 'get the template set up';
  if(!r.tplAccepted) return 'confirm they accept the template output';
  return 'template done';
}

async function loadChat(){

function paintChat(){

async function sendChat(){
  if(chatBusy) return;
  const inp=document.getElementById('chat-input'); const txt=(inp.value||'').trim();
  if(!txt && !chatFiles.length) return;
  const c=customers.find(x=>x.id===currentId); if(!c) return;
  chatBusy=true; inp.value=''; const sb=document.getElementById('chat-send'); if(sb) sb.disabled=true;
  // optimistic user bubble
  chatMsgs.push({role:'user',text:txt,at:new Date().toISOString(),attachments:chatFiles.map(f=>({name:f.name,url:f.url}))});
  chatMsgs.push({role:'assistant',text:'…',at:new Date().toISOString(),_pending:true});
  paintChat();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contactId:c.contactId||c.id,name:c.name,email:c.email||'',message:txt,attachments:chatFiles,thread:''})});
    const d=await r.json();
    chatMsgs=chatMsgs.filter(m=>!m._pending);
    if(d.assistant) chatMsgs.push(d.assistant);
    else if(d.error) chatMsgs.push({role:'assistant',text:'⚠️ '+d.error,at:new Date().toISOString()});
  }catch(e){
    chatMsgs=chatMsgs.filter(m=>!m._pending);
    chatMsgs.push({role:'assistant',text:'⚠️ Network error',at:new Date().toISOString()});
  }
  chatFiles=[]; renderChatFiles(); chatBusy=false; if(sb) sb.disabled=false; paintChat();
}

function areaCode(phone){
  if(!phone) return '';
  let d=String(phone).replace(/[^\d]/g,'');
  if(d.length===11 && d[0]==='1') d=d.slice(1);
  if(d.length>=10) return d.slice(0,3);
  return '';
}
function localTime(phone){
  const ac=areaCode(phone); const e=AREA_TZ[ac];
  if(!e) return null;
  const tz=e[0], region=e[1];
  try{
    const now=new Date();
    const t=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true}).format(now);
    const h=parseInt(new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',hour12:false}).format(now),10);
    const odd = (h<8 || h>=20);
    const soft = (h<9 || h>=18);
    return {t,h,odd,soft,tz,region};
  }catch(e){ return null; }
}
function localTimeHTML(phone){
  const lt=localTime(phone);
  if(!lt) return '';
  const color = lt.odd ? '#e5484d' : (lt.soft ? '#c77700' : '#2f9e57');
  const tip = lt.odd ? 'Odd hour — avoid calling' : (lt.soft ? 'Outside 9–6' : 'Good time to call');
  return `<span class="localtime" style="color:${color}" title="${tip}">🕘 ${esc(lt.t)} · ${esc(lt.region)}</span>`;
}

function mdBold(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }
function fuCardHTML(v,isEmail){

function fuCopy(btn){ try{ const t=decodeURIComponent(btn.getAttribute('data-copy')); navigator.clipboard.writeText(t); btn.textContent='Copied'; setTimeout(()=>btn.textContent='Copy',1200);}catch(e){} }
async function proposeFollowup(id){
  const c=customers.find(x=>x.id===id); if(!c) return;
  const out=document.getElementById('fu-out-'+id), btn=document.getElementById('fu-btn-'+id);
  if(btn){ btn.disabled=true; btn.textContent='Drafting…'; }
  out.innerHTML='<span class="muted" style="font-size:13px">Claude is reading the transcript, emails & quotes…</span>';
  try{
    const r=await fetch('/api/followup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contactId:c.contactId||c.id,email:c.email||'',name:c.name||''})});
    const d=await r.json();
    if(!d||!d.ok){ out.innerHTML='<span class="stale" style="font-size:13px">⚠ '+esc((d&&d.error)||'No draft returned')+'</span>'; }
    else {
      const call=(d.call||[]).map(v=>fuCardHTML(v,false)).join('');
      const email=(d.email||[]).map(v=>fuCardHTML(v,true)).join('');
      out.innerHTML=
        `<div class="lbl" style="font-weight:700;margin:2px 0 6px">📞 On the call — A/B</div><div style="display:grid;gap:8px">${call||'<span class="muted">—</span>'}</div>`+
        `<div class="lbl" style="font-weight:700;margin:14px 0 6px">✉ Email — A/B</div><div style="display:grid;gap:8px">${email||'<span class="muted">—</span>'}</div>`;
    }
  }catch(e){ out.innerHTML='<span class="stale" style="font-size:13px">⚠ '+esc(e.message||e)+'</span>'; }
  if(btn){ btn.disabled=false; btn.textContent='✨ Propose follow-up'; }
}
async function askCRM(){
  const inp=document.getElementById('ask'); const out=document.getElementById('ask-out');
  const q=(inp.value||'').trim(); if(!q) return;
  out.style.display='block'; out.textContent='Thinking…';
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});

    out.textContent = d && d.answer ? d.answer : (d && d.error ? ('⚠ '+d.error) : 'No answer.');
  }catch(e){ out.textContent='⚠ '+ (e && e.message || e); }

function taskDue(t){return parseD(t.iso||t.due);}
function taskDiff(t){const d=taskDue(t);if(!d)return null;const a=new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate());const b=new Date(d.getFullYear(),d.getMonth(),d.getDate());return Math.round((b-a)/86400000);}
function taskInRange(t){const diff=taskDiff(t);if(taskFilter==='all')return true;if(diff==null)return false;if(taskFilter==='past')return diff<0;if(taskFilter==='today')return diff===0;if(taskFilter==='tomorrow')return diff===1;if(taskFilter==='week')return diff>=0&&diff<=7;return true;}

/* Minimal DCLogic + x-dc DSL runtime — renders the design's Component to live DOM.
   Supports: {{binding}}, sc-for/list/as, sc-if/value, sc-camel-on-click/change,
   style-hover, sc-raw-select, checked="{{...}}", value="{{...}}". */
class DCLogic {
  constructor(){ this.props={}; }
  setState(patch){
    if(typeof patch==='function') patch=patch(this.state);
    Object.assign(this.state, patch);
    window.__rerender();
  }
}
// resolve a {{path}} against a scope object (supports c.foo, plain names, {{false}}/{{true}})
function resolveTok(tok, scope){
  tok=tok.trim();
  if(tok==='true') return true;
  if(tok==='false') return false;
  const parts=tok.split('.');
  let v=scope;
  for(const p of parts){ if(v==null) return undefined; v=v[p]; }
  return v;
}
// interpolate a string that may contain {{...}} pieces
function interp(str, scope){
  return str.replace(/\{\{([^}]+)\}\}/g, (_,e)=>{
    const v=resolveTok(e,scope);
    return v==null?'':String(v);
  });
}
// Walk a template element tree, producing real DOM bound to scope + vals
function build(node, scope){
  if(node.nodeType===3){ // text
    return document.createTextNode(interp(node.textContent, scope));
  }
  if(node.nodeType!==1) return document.createDocumentFragment();
  const tag=node.tagName.toLowerCase();

  // sc-for
  if(tag==='sc-for'){
    const listExpr=node.getAttribute('list'); const asName=node.getAttribute('as');
    const arr=resolveTok(listExpr.replace(/[{}]/g,''), scope)||[];
    const frag=document.createDocumentFragment();
    arr.forEach(item=>{
      const childScope=Object.assign(Object.create(scope), {[asName]:item});
      for(const ch of node.childNodes) frag.appendChild(build(ch, childScope));
    });
    return frag;
  }
  // sc-if
  if(tag==='sc-if'){
    const val=resolveTok(node.getAttribute('value').replace(/[{}]/g,''), scope);
    const frag=document.createDocumentFragment();
    if(val){ for(const ch of node.childNodes) frag.appendChild(build(ch, childScopeOrSelf(scope))); }
    return frag;
  }

  // sc-raw-select -> real <select>
  const realTag = (tag==='sc-raw-select')?'select':tag;
  const el=document.createElement(realTag);

  for(const attr of node.attributes){
    let name=attr.name, val=attr.value;
    if(name==='style-hover'){ // apply on mouseenter/leave
      const hov=val;
      el.addEventListener('mouseenter',()=>{ el.setAttribute('data-base',el.getAttribute('style')||''); applyInline(el,hov); });
      el.addEventListener('mouseleave',()=>{ el.setAttribute('style', el.getAttribute('data-base')||''); });
      continue;
    }
    if(name.startsWith('sc-camel-on-')){ // event handler
      const ev=name.replace('sc-camel-on-',''); // click / change
      const handler=resolveTok(val.replace(/[{}]/g,''), scope);
      if(typeof handler==='function') el.addEventListener(ev, handler);
      continue;
    }
    if(name==='sc-camel-view-box'){ el.setAttribute('viewBox', val); continue; }
    if(name==='checked'){ const v=resolveTok(val.replace(/[{}]/g,''),scope); if(v) el.checked=true; continue; }
    if(name==='value' && /\{\{/.test(val)){
      if(realTag==='select'){ el.__deferredValue=interp(val,scope); } // set AFTER options are appended
      else { el.value=interp(val,scope); }
      continue;
    }
    // interpolate any {{...}} in the attribute value (style, etc.)
    el.setAttribute(name, interp(val, scope));
  }
  for(const ch of node.childNodes) el.appendChild(build(ch, scope));
  if(el.__deferredValue!==undefined){ el.value=el.__deferredValue; delete el.__deferredValue; }
  return el;
}
function childScopeOrSelf(scope){ return scope; }
function applyInline(el, css){
  const base=el.getAttribute('style')||'';
  el.setAttribute('style', base+';'+css);
}

let __comp, __templateRoot, __lastSelId;
window.__rerender=function(){
  // capture scroll positions of keep-scroll containers before we rebuild
  const saved={};
  document.querySelectorAll('[data-keepscroll]').forEach(el=>{ if(el.id) saved[el.id]=el.scrollTop; });
  const selNow = __comp && __comp.state ? __comp.state.selId : undefined;
  const selChanged = selNow !== __lastSelId;

  const vals=__comp.renderVals();
  const scope=Object.assign(Object.create(null), vals);
  const mount=document.getElementById('__mount');
  mount.innerHTML='';
  for(const ch of __templateRoot.childNodes) mount.appendChild(build(ch, scope));

  // restore scroll: always keep the customer list where it was;
  // keep the detail scroll only if the same contact is still selected (new contact → top).
  // Clamp to valid range so a now-shorter list can't be scrolled past its content into blank space.
  requestAnimationFrame(()=>{
    const list=document.getElementById('__listScroll');
    if(list && saved['__listScroll']!=null){
      const max=Math.max(0, list.scrollHeight - list.clientHeight);
      list.scrollTop=Math.min(saved['__listScroll'], max);
    }
    const detail=document.getElementById('__detailScroll');
    if(detail){
      const max=Math.max(0, detail.scrollHeight - detail.clientHeight);
      detail.scrollTop = selChanged ? 0 : Math.min(saved['__detailScroll']||0, max);
    }
  });
  __lastSelId = selNow;
};
window.__boot=function(){
  __comp=new Component();
  window.__comp=__comp;
  __lastSelId=__comp.state?__comp.state.selId:undefined;
  const tpl=document.getElementById('__template');
  __templateRoot=tpl.content;
  window.__rerender();
};

/* ===== PERSISTENCE BRIDGE: v2 handlers -> real API writers ===== */
/* Wraps the component's renderVals() so every local edit ALSO persists via our
   existing writer functions (rSet/rToggle/rSelect/rNoteSave/setOwner/…). */
(function(){
  const RUNGKEY=['likes','sees','invite',null,'reach'];
  const RUNGSET=['rLikes','rSees','rInvite',null,null,'rReach'];
  const NOTEKEY=['likesNote','seesNote','inviteNote','tplNote','reachNote'];

  function wrap(fn, extra){ return function(){ const r=fn&&fn.apply(this,arguments); try{ extra.apply(this,arguments); }catch(e){ console.error('persist',e);} return r; }; }

  // Load a customer's Client Sequence once (async), then re-render so the card fills in.
  const _seqLoading={};
  function ensureSeq(cid){
    const c=customers.find(x=>x.id===cid); if(!c) return;
    if(Array.isArray(c._seq) || _seqLoading[cid]) return;      // already loaded / in-flight
    const contactId=c.contactId||'';
    if(!/^[0-9a-f-]{32,36}$/i.test(contactId)){ c._seq=[]; return; }  // no live id yet
    _seqLoading[cid]=true;
    fetch('/api/sequences?contact='+encodeURIComponent(contactId))
      .then(r=>r.ok?r.json():null)
      .then(d=>{ c._seq=(d&&d.touches)||[]; if(window.__rerender) window.__rerender(); })
      .catch(()=>{ c._seq=[]; })
      .finally(()=>{ _seqLoading[cid]=false; });
  }

  window.__bridge=function(vals){
    const comp=this;                        // the Component instance (bridge called via .call(this,vals))
    const sel=vals.sel && vals.sel._real; // real customer
    if(!sel) return vals;
    const cid=sel.id;

    // ---- readiness meters (rungs) ----
    if(Array.isArray(vals.rungs)){
      vals.rungs.forEach((rg,i)=>{
        // meter chips (value is in .title, e.g. "75"; empty-circle buttons)
        if(Array.isArray(rg.chips)) rg.chips.forEach(ch=>{
          const v=Number(ch.title);
          if(RUNGSET[i]&&!isNaN(v)) ch.onTap=wrap(ch.onTap,()=>rSet(cid,RUNGSET[i],v));
        });
        // template toggles (rung 4): design cycles a progress int; we map to the 4 bools
        if(Array.isArray(rg.tpl)) rg.tpl.forEach((tg,j)=>{
          const flag=['tplAgreed','tplSent','tplSetup','tplAccepted'][j];
          const cur=!!(sel.readiness&&sel.readiness[flag]);
          tg.onTap=wrap(tg.onTap,()=>rToggle(cid,flag,cur?'false':'true'));
        });
        // Make Reports toggles (rung 4): 3-stage progress -> 3 bools
        if(Array.isArray(rg.rep)) rg.rep.forEach((tg,j)=>{
          const flag=['repCanMake','repSample','repReal'][j];
          const cur=!!(sel.readiness&&sel.readiness[flag]);
          tg.onTap=wrap(tg.onTap,()=>rToggle(cid,flag,cur?'false':'true'));
        });
        // rung notes persist via the global commitEdit (key 'note-{id}-{i}') — handled below.
        // suggestion-append writes into the edit buffer; it persists when the note is committed.
      });
    }

    // ---- approved / role / owner / engaged / deal / quiet / tri ----
    if(vals.toggleApproved){ const cur=!!(sel.readiness&&sel.readiness.approved); vals.toggleApproved=wrap(vals.toggleApproved,()=>rToggle(cid,'approved',cur?'false':'true')); }
    if(vals.setRole){ vals.setRole=wrap(vals.setRole,(e)=>rSelect(cid,'roleType',e.target.value)); }
    if(vals.setOwner){ vals.setOwner=wrap(vals.setOwner,(e)=>setOwner(cid,e.target.value)); }
    if(vals.toggleEngagedSel){ const cur=!!sel.engaged; vals.toggleEngagedSel=wrap(vals.toggleEngagedSel,()=>setEngaged(cid,!cur)); }
    if(vals.setDealEng){ vals.setDealEng=wrap(vals.setDealEng,(e)=>apiPost('/api/update',{id:sel.contactId||cid,contactId:sel.contactId||cid,field:'engineers',value:parseInt(e.target.value||'0',10)})); }
    if(vals.setDealRpts){ vals.setDealRpts=wrap(vals.setDealRpts,(e)=>apiPost('/api/update',{id:sel.contactId||cid,contactId:sel.contactId||cid,field:'reportsMonth',value:parseInt(e.target.value||'0',10)})); }
    if(vals.pickQuiet){ vals.pickQuiet=wrap(vals.pickQuiet,(e)=>{ if(e.target.value) apiPost('/api/update',{id:sel.contactId||cid,contactId:sel.contactId||cid,field:'quietUntil',value:e.target.value}); }); }
    if(vals.clearQuiet){ vals.clearQuiet=wrap(vals.clearQuiet,()=>apiPost('/api/update',{id:sel.contactId||cid,contactId:sel.contactId||cid,field:'quietUntil',value:''})); }

    // meet-mgmt tri
    if(Array.isArray(vals.tri)) vals.tri.forEach((t)=>{ t.onTap=wrap(t.onTap,()=>rSelect(cid,'meetMgmt',t.label)); });

    // ---- field editors (demands / approval / who / mgmtNote / myNote / roleDesc) ----
    // v2 commits edits via commitEdit using state.edit.key. We map key prefixes to writers.
    if(vals.commitEdit){
      const origCommit=vals.commitEdit;
      vals.commitEdit=function(){
        const ed=comp.state && comp.state.edit;        // capture BEFORE original clears it
        const key=ed&&ed.key, val=ed&&ed.val;
        const rr=origCommit.apply(this,arguments);
        if(key){
          if(key.startsWith('demands')) rNoteSave(cid,'demands',val,'demands');
          else if(key.startsWith('approval')) rNoteSave(cid,'approvalProcess',val,'approvalProcess');
          else if(key.startsWith('who')) rNoteSave(cid,'whoApproves',val,'whoApproves');
          else if(key.startsWith('mgmt')) rNoteSave(cid,'meetMgmtNote',val,'meetMgmtNote');
          else if(key.startsWith('roleDesc')) rSelect(cid,'roleDesc',val);
          else if(key.startsWith('engtypes-')){ if(sel._real) sel._real.engineerTypes=val; apiPost('/api/update',{id:sel.contactId||cid,contactId:sel.contactId||cid,field:'engineerTypes',value:val}); }
          else if(key.startsWith('reptypes-')){ if(sel._real) sel._real.reportingTypes=val; apiPost('/api/update',{id:sel.contactId||cid,contactId:sel.contactId||cid,field:'reportingTypes',value:val}); }
          else if(key.startsWith('myNote')){ sel.myNote=val; apiPost('/api/update',{id:sel.contactId||cid,contactId:sel.contactId||cid,field:'note',value:val}); }
          else if(key.startsWith('note-')){ const i=parseInt(key.split('-')[2],10); if(NOTEKEY[i]) rNoteSave(cid,NOTEKEY[i],val,NOTEKEY[i]); }
        }
        return rr;
      };
    }

    // ---- star (list rows + header) + load sequence on select ----
    if(Array.isArray(vals.rows)) vals.rows.forEach(row=>{
      if(row.onStar){ row.onStar=wrap(row.onStar,(e)=>{ toggleStar(row.id); }); }
      if(row.onSelect){ row.onSelect=wrap(row.onSelect,()=>{ ensureSeq(row.id); }); }
    });
    // ensure the currently-selected customer's sequence is loaded (first render / direct select)
    ensureSeq(cid);
    if(vals.toggleStar){ vals.toggleStar=wrap(vals.toggleStar,()=>toggleStar(cid)); }

    // ---- sequence approve/skip ----
    if(Array.isArray(vals.seq)) vals.seq.forEach(s=>{
      if(s.approve) s.approve=wrap(s.approve,()=>{ if(typeof seqPatch==='function'&&s.pageId){ seqPatch(cid,s.pageId,{status:'Approved'}); if(window.__rerender) setTimeout(window.__rerender,0); } });
      if(s.skip)    s.skip=wrap(s.skip,()=>{ if(typeof seqPatch==='function'&&s.pageId){ seqPatch(cid,s.pageId,{status:'Skipped'}); if(window.__rerender) setTimeout(window.__rerender,0); } });
      if(s.setDate) s.setDate=wrap(s.setDate,(e)=>{ const v=e&&e.target&&e.target.value; if(v&&typeof seqPatch==='function'&&s.pageId){ seqPatch(cid,s.pageId,{date:v}); } });
    });

    // ---- tasks toggle + add ----
    if(Array.isArray(vals.tasks)) vals.tasks.forEach((t,i)=>{ if(t.onToggle){ t.onToggle=wrap(t.onToggle,()=>{ if(typeof toggleTask==='function') toggleTask(cid,i); }); } });
    if(vals.addTask){ const origAdd=vals.addTask; vals.addTask=function(){
        const nt=(comp.state&&comp.state.newTask||'').trim(); // capture BEFORE original clears it
        const type=(comp.state&&comp.state.ntType)||'Task';
        const due=(comp.state&&comp.state.ntDate)||'';
        const rr=origAdd.apply(this,arguments);
        if(nt){ Promise.resolve(apiPost('/api/task',{id:cid,contactId:sel.contactId||cid,task:nt,type:type,due:due})).catch(()=>{}); }
        return rr;
      }; }

    return vals;
    function curEditVal(){ return null; }
  };
})();

  heatColor(h){ return {hot:'#F15A24',warm:'#E0A82E',luke:'#8FA0BF',cold:'#C3CBD6'}[h]; }
  hasUpcoming(c){
    // A genuinely upcoming demo/meeting: today or later.
    const today=new Date(); today.setHours(0,0,0,0);
    // 1) upcomingDate is the API's soonest FUTURE scheduled demo (ISO yyyy-mm-dd) — already future-only
    if(c.upcomingDate){ const d=new Date(c.upcomingDate); if(!isNaN(d) && d>=today) return true; }
    // 2) fallback: parse nextMeeting display ("21-Jul-26" or "12-Aug 2:00 PM") and require today-or-later
    const dt=this.parseMeetDate(c.nextMeeting);
    return !!(dt && dt>=today);
  }
  parseMeetDate(s){
    if(!s) return null;
    const M={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    // matches "21-Jul-26", "12-Aug", "12-Aug 2:00 PM"
    const m=String(s).match(/(\d{1,2})[-\s]([A-Za-z]{3})(?:[-\s](\d{2,4}))?/);
    if(!m) return null;
    const day=parseInt(m[1],10); const mon=M[m[2].toLowerCase()]; if(mon==null) return null;
    let yr=m[3]?parseInt(m[3],10):new Date().getFullYear(); if(yr<100) yr+=2000;
    const d=new Date(yr,mon,day); d.setHours(0,0,0,0); return isNaN(d)?null:d;
  }
  scoreColor(s){ return s>=75?'#145A3D':s>=55?'#E8A33D':s>=40?'#8FA0BF':'#B3261E'; }
  rungVals(c){ const o=this.state.over[c.id]||{}; return c.rungs.map((v,i)=> (i===3||i===4)?null:(o[i]!==undefined?o[i]:v)); }
  tplProg(c){ const o=this.state.tplOver[c.id]; return o!==undefined?o:c.tpl; }
  repProg(c){ const o=this.state.repOver[c.id]; return o!==undefined?o:(c.rep||0); }
  ladderHigh(c){ const rv=this.rungVals(c); let n=0; rv.forEach((v,i)=>{ if(i===3){ if(this.repProg(c)>=3)n++; } else if(i===4){ if(this.tplProg(c)>=3)n++; } else if(v>=75)n++; }); return n; }
  field(key, base){
    const val = this.state.fieldOver[key]!==undefined ? this.state.fieldOver[key] : base;
    const editing = this.state.edit.key===key;
    return { disp: val||'—', val, editing, resting:!editing, start:()=>this.setState({edit:{key,val:val||''}}) };
  }
  fmtDate(iso){ const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const p=iso.split('-'); return p[2]+'-'+M[parseInt(p[1],10)-1]; }

  // Split a text block into readable paragraphs, pulling out a bold "lead-in" phrase when present.
  // Splits on blank lines first; if it's one run-on block, splits on single newlines; each becomes a point.
  toPoints(text){
    if(!text||!String(text).trim()) return [];
    const raw = String(text).replace(/\r/g,'');
    // prefer blank-line paragraphs; fall back to single newlines; if neither, one paragraph
    let parts = raw.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
    if(parts.length<=1){ const byLine = raw.split(/\n/).map(s=>s.trim()).filter(Boolean); if(byLine.length>1) parts = byLine; }
    return parts.map(p=>{
      // lead-in = short label before first period or em-dash (e.g. "Data privacy." / "Volume —")
      const m = p.match(/^([^.\u2014\n]{2,42}?)(\u2014|\.\s)(.*)$/s);
      if(m && m[1].split(' ').length<=7){
        const lead = m[1].trim() + (m[2]==='\u2014' ? ' —' : '');
        const rest = (m[3]||'').trim();
        return { lead, rest, hasLead:true, full:p };
      }
      return { lead:'', rest:p, hasLead:false, full:p };
    });
  }

  renderVals(){

    let list = CUST.filter(c=>{
      if(st.hideLost && c.lost) return false;

      if(st.heat!=='all' && c.heat!==st.heat) return false;
      const starred = st.starOver[c.id]!==undefined? st.starOver[c.id] : !!c.star;
      const owner = (st.ownerOver[c.id]||c.owner||'').toString().trim().toLowerCase();
      if(st.starBy==='any' && !starred) return false;
      if(st.starBy!=='none' && st.starBy!=='any'){
        const want=st.starBy.toString().trim().toLowerCase();
        const ownerMatch = owner===want || owner.startsWith(want+' ') || owner.split(/\s+/)[0]===want;
        if(!(starred && ownerMatch)) return false;
      }
      if(st.q){ const q=st.q.toLowerCase(); if(!(c.name+' '+c.company+' '+c.email).toLowerCase().includes(q)) return false; }
      return true;
    });
    const byName=(a,b)=>String(a.name||'').localeCompare(String(b.name||''));
    const sorters = {
      priority:(a,b)=>(b.score-a.score)||(a.staleness-b.staleness)||byName(a,b),
      score:(a,b)=>(b.score-a.score)||byName(a,b),

      recent:(a,b)=>(a.staleness-b.staleness)||byName(a,b),
      demo:(a,b)=>((a.upcomingDate?0:1)-(b.upcomingDate?0:1))||String(a.upcomingDate||'9999').localeCompare(String(b.upcomingDate||'9999'))||byName(a,b)
    };
    list.sort(sorters[st.sort]||sorters.priority);
    const sel = CUST.find(c=>c.id===st.selId) || CUST[0];

    const rows = list.map(c=>{

      });
      let flag='', flagColor='#98A2B3';

      const starred = st.starOver[c.id]!==undefined? st.starOver[c.id] : !!c.star;
      return { id:c.id, initials:c.name.split(' ').map(w=>w[0]).join(''), name:c.name, company:c.company, photo:c.photo||'', hasPhoto:!!c.photo,
        photoBg: c.photo?('url('+c.photo+')'):'', avInit: c.photo?'':c.name.split(' ').map(w=>w[0]).join(''),

        stageBg: c.lost?'#FEF1EE':(c.stage==='Trial'?'#EAF7EF':'#EEF2F6'), stageColor: c.lost?'#B3261E':(c.stage==='Trial'?'#145A3D':'#5B6B85'),
        ladder, flag, flagColor, score:c.score, scoreColor:this.scoreColor(c.score),
        timeStr:c.time.replace(' ','').toLowerCase(), timeColor:{g:'#2FBF71',a:'#E8A33D',r:'#B3261E'}[c.tone],
        rowBg: c.id===sel.id?'#EAF7EF':'transparent', edge: c.id===sel.id?'#145A3D':'transparent',
        starGlyph: starred?'★':'☆', starColor: starred?'#E0A82E':'#D5DCE3',
        onStar:(e)=>{ e.stopPropagation(); this.setState(s=>({starOver:{...s.starOver,[c.id]:!starred}})); },
        onSelect:()=>this.setState({selId:c.id}) };
    });

    const rv=this.rungVals(sel), tprog=this.tplProg(sel), rprog=this.repProg(sel);
    const high=this.ladderHigh(sel);
    const mode = high>=5
      ? { label:'Champion mode', bg:'#EAF7EF', border:'#CBEBD8', accent:'#145A3D', sub:'#3C6B54' }
      : { label:'Proof mode', bg:'#FBF2E2', border:'#EAD9AC', accent:'#E8A33D', sub:'#8A5A16' };
    const approved = st.aprOver[sel.id]!==undefined? st.aprOver[sel.id] : sel.approved;
    const apr = approved ? {label:'✓ Approved by mgmt',bg:'#145A3D',color:'#fff',border:'#145A3D'} : {label:'○ Approved by mgmt',bg:'#fff',color:'#98A2B3',border:'#D5DCE3'};

    const rungs = RN.map((name,i)=>{
      const isTpl = i===4;

      const sugKey = 'sug-'+sel.id+'-'+i;
      return { step:i+1, name, isTpl, isRep, isStaged, notTpl:!isStaged,

        stepBg: done?'#145A3D':'#EEF2F6', stepColor: done?'#fff':'#98A2B3',

        chips: isStaged?[] : [0,25,50,75,100].map(v=>({ title:String(v),
          bg: v<=val && val>0 ? (val>=75?'#145A3D':v===0?'#F7F9F8':'#E8A33D') : '#F7F9F8',
          border: v<=val && val>0 ? (val>=75?'#145A3D':'#E8A33D') : '#DDE3EA',
          onTap:()=>this.setState(s=>({over:{...s.over,[sel.id]:{...(s.over[sel.id]||{}),[i]:v}}})) })),
        tpl: isTpl? ['Agreed','Sent','Setup','Accepted'].map((label,j)=>{
          const on = j<tprog, next = j===tprog;
          return { label, tick:on?'✓':String(j+1), linkDisp: j===0?'none':'inline-block', linkBg: on?'#145A3D':'#E7EBF0',
            bg: on?'#EAF7EF':'#fff', color: on?'#145A3D':(next?'#8A5A16':'#B9C2C7'), border: on?'#CBEBD8':(next?'#E8A33D':'#E7EBF0'),
            weight: next?'700':'600', dotBg: on?'#145A3D':(next?'#E8A33D':'#DDE3EA'),
            onTap:()=>this.setState(s2=>({tplOver:{...s2.tplOver,[sel.id]: (j+1===tprog)? j : j+1}})) };
        }) : [],
        rep: isRep? ['Can make report','Made sample','Made real'].map((label,j)=>{
          const on = j<rprog, next = j===rprog;
          return { label, tick:on?'✓':String(j+1), linkDisp: j===0?'none':'inline-block', linkBg: on?'#145A3D':'#E7EBF0',
            bg: on?'#EAF7EF':'#fff', color: on?'#145A3D':(next?'#8A5A16':'#B9C2C7'), border: on?'#CBEBD8':(next?'#E8A33D':'#E7EBF0'),

    const triSel = st.triOver[sel.id]!==undefined? st.triOver[sel.id] : sel.tri;

      quietOn:!!quietDate, quietOff:!quietDate, quietDate:quietDate||'',

      roleDescF:this.field('roledesc-'+sel.id, sel.roleDesc),
      myNoteF:(()=>{ const f=this.field('mynote-'+sel.id, sel.myNote); if(!f.val && !f.editing) f.disp='Add a quick refresher — timing, family, preferences…'; return f; })(),

      whoF:this.field('who-'+sel.id, sel.whoSees),

      ladderSummary: high+' of 6 rungs high', rungs,
      demands: (this.field('demands-'+sel.id, sel.demands).val||'').split('\n').filter(Boolean).map((line,i)=>({n:(i+1)+'.',text:line.replace(/^\d+\)\s*/,'')})),
      tri, team, teamHas:team.length>0, teamEmpty:team.length===0,
      teamTitle:'Team at '+sel.company+(team.length?' — '+team.length:''),
      seq, demos, hasDemos, tasks,
      activity:((st.extraActs[sel.id]||[]).concat(sel.activity)),
      // Sequence step composer
      seqComposing: st.seqComposing, seqNotComposing: !st.seqComposing,
      seqDesc: st.seqDesc, seqNewDate: st.seqNewDate, seqActionVal: st.seqAction,

      seqPlayChips: PLAYS.map(p=>({ label:p, on: st.seqPlay===p,
        bg: st.seqPlay===p?'#145A3D':'#F4F8F5', color: st.seqPlay===p?'#fff':'#33453B', border: st.seqPlay===p?'#145A3D':'#DCEEE3',
        onTap:()=>this.setState(s=>({seqPlay: s.seqPlay===p?'':p})) })),
      seqTargetChips: RN.map(n=>({ label:n, on: st.seqTargets.indexOf(n)>=0,
        bg: st.seqTargets.indexOf(n)>=0?'#145A3D':'#fff', color: st.seqTargets.indexOf(n)>=0?'#fff':'#5B6B85', border: st.seqTargets.indexOf(n)>=0?'#145A3D':'#DDE3EA',
        onTap:()=>this.setState(s=>{ const has=s.seqTargets.indexOf(n)>=0; return {seqTargets: has? s.seqTargets.filter(x=>x!==n) : s.seqTargets.concat(n)}; }) })),
      saveSeqAdd:()=>{ const desc=(this.state.seqDesc||'').trim(); const play=this.state.seqPlay; if(!desc && !play) return;

        if(typeof addSeqStep==='function') addSeqStep(sel.contactId||sel.id, sel.name, iso, action, desc, play, entry.targets);
      },
      actHas:((st.extraActs[sel.id]||[]).length + sel.activity.length)>0,
      actEmpty:((st.extraActs[sel.id]||[]).length + sel.activity.length)===0,
      actComposing: st.actComposing, actNotComposing: !st.actComposing,
      actText: st.actText, actDate: st.actDate,
      startActAdd:()=>this.setState({actComposing:true, actText:'', actDate:''}),
      cancelActAdd:()=>this.setState({actComposing:false, actText:''}),
      setActText:e=>this.setState({actText:e.target.value}),
      setActDate:e=>this.setState({actDate:e.target.value}),
      saveActAdd:()=>{ const text=(this.state.actText||'').trim(); if(!text) return;
        const iso=this.state.actDate||''; const when=iso? this.fmtDate(iso) : 'just now';
        const entry={subj:text, when, manual:true};
        this.setState(s=>({ extraActs:{...s.extraActs, [sel.id]:[entry].concat(s.extraActs[sel.id]||[])}, actComposing:false, actText:'', actDate:'' }));

      },
      comms,
      emailPreview, emailPreviewOpen, emailPreviewClosed,
      newTask:st.newTask, setNewTask:e=>this.setState({newTask:e.target.value}),
      addTask:()=>{ if(!st.newTask.trim())return; const due=st.ntDate||''; const type=st.ntType||'Task'; this.setState(s=>({extraTasks:{...s.extraTasks,[sel.id]:[...(s.extraTasks[sel.id]||[]),{done:false,text:s.newTask.trim(),due:due,dd:null,type:type}]},newTask:'',ntDate:''})); },
      seqTabs, seqSteps,
      taskHideDone:st.taskHideDone, toggleTaskDone:()=>this.setState(s=>({taskHideDone:!s.taskHideDone})),

      taskCount: allTasks.length+' open across '+new Set(allTasks.map(t=>t.custId)).size+' customers',
      taskGroups
    };
  }
}
